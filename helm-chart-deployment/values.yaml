    configMap:
      name: sip-dev-config
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false
# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - name: sip-dev-configmap
    mountPath: '/etc/sipconfig'
    readOnly: true
# - name: foo
#   mountPath: "/etc/foo"
