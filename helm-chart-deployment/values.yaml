# Default values for helm-chart-deployment.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: asx-jfux-docker.artifactrepo.kenvue.com/asx-jfux-docker/rdx-sip-bs-ms
  pullPolicy: Always
  tag: prod-20260225064606 # Change this to your specific image tag ..
imagePullSecrets:
  - name: sip-nexus-cred-new
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''

podAnnotations:
  prometheus.io/scheme: 'http'
  prometheus.io/scrape: 'true'
  prometheus.io/port: '3000' # application port
  prometheus.io/path: '/observability/metrics'
podLabels: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  name: sipdev-app
  type: ClusterIP
  port: 3000
  selector:
    app: sip-bs-ms

ingress:
  enabled: false
  className: 'sip-ingress'
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: sipdev.kenvue.com
      paths:
        - path: /api
          pathType: ImplementationSpecific
  tls: []

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

  #livenessProbe:
  #httpGet:
  #path: /formula/formula-details/FML_JNJ93001278
  #port: 3000
  #readinessProbe:
  #httpGet:
  #path: /formula/formula-details/FML_JNJ93001278
  #port: 3000

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

